name: Build & Package

on:
  push:
    branches: [v2.0-plugin]
    tags: ['v*']
  pull_request:
    branches: [v2.0-plugin]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Package plugin
        run: |
          STAGE=$(mktemp -d)
          # Copy only the two plugin DLLs — everything else is provided by the Jellyfin host
          cp src/Jellyfin.Plugin.JellyDiscover/bin/Release/net9.0/Jellyfin.Plugin.JellyDiscover.dll "$STAGE/"
          cp src/JellyDiscover.Core/bin/Release/net9.0/JellyDiscover.Core.dll "$STAGE/"
          # meta.json is required inside the zip for Jellyfin to identify the plugin
          cp src/Jellyfin.Plugin.JellyDiscover/meta.json "$STAGE/"
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          cd "$STAGE"
          zip "${GITHUB_WORKSPACE}/jellydiscover_${VERSION}.0.zip" *.dll meta.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellydiscover-plugin
          path: jellydiscover_*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jellydiscover-plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'pre') }}
          generate_release_notes: true
          files: jellydiscover_*.zip
