name: Build & Package

# Every push and PR builds and tests. A tag additionally packages, publishes the release,
# and rewrites manifest.json from the artifact that was actually uploaded.
#
# That last step is the point. The 2.0.0 release shipped a manifest whose checksum came
# from a locally-built zip while a differently-built zip was attached to the release, so
# one-click install failed for everyone with a checksum error. Here the zip that is hashed
# and the zip that is uploaded are the same file on the same runner, so they cannot diverge.

on:
  push:
    branches: [v2.0-plugin]
    tags: ['v*']
  pull_request:
    branches: [v2.0-plugin]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # JellyDiscover.Core has no Jellyfin dependency, so this needs no server and runs
      # in about a second on a clean runner.
      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # Directory.Build.props is the single source of truth for the version.
          base=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          version="${base}.0"

          # On a tag, the tag and the props file must agree. Disagreeing silently is how
          # you end up publishing an artifact that does not match its own manifest.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            tag_base="${tag_version%%-*}"
            if [[ "${tag_base}" != "${base}" ]]; then
              echo "::error::Tag v${tag_base} does not match <Version>${base}</Version> in Directory.Build.props"
              exit 1
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}"

      - name: Package plugin
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stage=$(mktemp -d)

          # Only our own assemblies. Everything else in the build output is provided by
          # the host, and shipping a second copy risks an assembly load conflict.
          cp src/Jellyfin.Plugin.JellyDiscover/bin/Release/net9.0/Jellyfin.Plugin.JellyDiscover.dll "$stage/"
          cp src/JellyDiscover.Core/bin/Release/net9.0/JellyDiscover.Core.dll "$stage/"

          # meta.json must be inside the zip for Jellyfin to identify the plugin.
          python3 - "$version" "$stage" <<'PY'
          import json, sys, datetime
          version, stage = sys.argv[1], sys.argv[2]
          meta = json.load(open('src/Jellyfin.Plugin.JellyDiscover/meta.json'))
          meta['version'] = version
          meta['timestamp'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          json.dump(meta, open(f'{stage}/meta.json', 'w'), indent=4)
          PY

          cd "$stage"
          zip -qr "${GITHUB_WORKSPACE}/jellydiscover_${version}.zip" .
          cd "${GITHUB_WORKSPACE}"
          md5sum "jellydiscover_${version}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellydiscover-plugin
          path: jellydiscover_*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch rather than the detached tag, so the manifest commit has
          # somewhere to land.
          ref: v2.0-plugin
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jellydiscover-plugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'pre') }}
          generate_release_notes: true
          files: jellydiscover_*.zip

      - name: Publish to the plugin manifest
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          tag="${GITHUB_REF#refs/tags/}"
          asset="jellydiscover_${version}.zip"

          # Hashing the same file that was just uploaded. This is what makes a checksum
          # mismatch structurally impossible rather than merely unlikely.
          checksum=$(md5sum "$asset" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${asset}"
          echo "Publishing ${version} with checksum ${checksum}"

          abi=$(python3 -c "import json;print(json.load(open('src/Jellyfin.Plugin.JellyDiscover/meta.json'))['targetAbi'])")

          python3 - "$version" "$checksum" "$url" "$abi" "$tag" <<'PY'
          import json, sys, datetime
          version, checksum, url, abi, tag = sys.argv[1:6]
          manifest = json.load(open('manifest.json'))
          entry = {
              'version': version,
              'changelog': f'See the release notes for {tag}.',
              'targetAbi': abi,
              'sourceUrl': url,
              'checksum': checksum,
              'timestamp': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          }
          # Newest first, and never two entries claiming the same version.
          others = [v for v in manifest[0]['versions'] if v['version'] != version]
          manifest[0]['versions'] = [entry] + others
          json.dump(manifest, open('manifest.json', 'w'), indent=4)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Publish ${version} to the plugin manifest [skip ci]"
          git push origin v2.0-plugin
